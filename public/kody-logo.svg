  <linearGradient id="pantalla" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16213e"/><stop offset="1" stop-color="#05081a"/></linearGradient>
  <radialGradient id="iris" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#0b0726"/><stop offset=".35" stop-color="#1d4ed8"/><stop offset=".7" stop-color="#22d3ee"/><stop offset="1" stop-color="#a5f3fc"/></radialGradient>
