  <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#60a5fa" stop-opacity=".9"/><stop offset=".5" stop-color="#3b82f6" stop-opacity=".3"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
  <linearGradient id="casco" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bcdcff"/><stop offset=".45" stop-color="#5b9cf0"/><stop offset="1" stop-color="#1e4fb8"/></linearGradient>
  <linearGradient id="cuerpo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b9cf0"/><stop offset="1" stop-color="#1e3f9a"/></linearGradient>
